---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  annotations:
    pipelinesascode.tekton.dev/task: "[tempo-install, operators-install, tempo-e2e-tests]"
  name: tempo-operator-e2e-tests-pipeline
spec:
  description: |
    This pipeline automates the process of running end-to-end tests for OpenShift Tempo Operator
    using an ephemeral OpenShift CI HyperShift cluster. The pipeline provisions the cluster,
    installs the OpenShift Tempo operator using the installer, installs dependent operators,
    runs the tests, and collects artifacts. The cluster is cleaned up automatically with the
    owning PipelineRun.
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: 'tempo-operator-e2e-tests'
    - name: namespace
      description: 'Namespace to run tests in'
      default: 'openshift-tempo-operator'
    - name: operand_jaeger_query_version
      description: Version of Jaeger Query operand
      default: "1.68.0"
    - name: operator_version
      description: Version of the operator
      default: "0.22.0"
    - name: operator_tempo_version
      description: Version of Tempo in the operator
      default: "2.10.8"
    - name: operator_tempo_query_version
      description: Version of Tempo query in the operator
      default: "2.10.8"
    - name: operand_tempo_version
      description: Version of the Tempo operand
      default: "2.10.8"
    - name: tempo_tests_branch
      description: "The repository branch from which to run the tests"
      default: "rhosdt-3.11"
    - name: skip_tests
      description: "Tests to be skipped seperated with a space delimiter"
      default: "tests/e2e-openshift-object-stores/* tests/e2e-openshift-ossm/* tests/e2e/generate"
    - name: rhosdt_version
      description: "RHOSDT product version used to tag RapiDAST scan results in GCS"
      default: "3.11"
    - name: ocp_version
      description: OpenShift minor version for the ephemeral HyperShift cluster
      default: "4.18"
    - name: compute_node_type
      description: AWS instance type for ephemeral HyperShift worker nodes
      default: "m5.2xlarge"
    - name: hypershift_node_count
      description: Number of worker nodes for the ephemeral HyperShift cluster
      default: "3"
    - name: hosted_management_cluster
      description: Hosted management cluster used to provision the ephemeral cluster
      default: "hosted-mgmt2"
  tasks:
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
    - name: prepare-cluster-env
      runAfter:
        - parse-metadata
      when:
        - input: $(tasks.parse-metadata.results.test-event-type)
          operator: in
          values: ["push", "Push", "PUSH", "incoming", "Incoming", "INCOMING"]
      params:
        - name: compute_node_type
          value: $(params.compute_node_type)
        - name: hypershift_node_count
          value: $(params.hypershift_node_count)
        - name: hosted_management_cluster
          value: $(params.hosted_management_cluster)
      taskSpec:
        params:
          - name: compute_node_type
            type: string
          - name: hypershift_node_count
            type: string
          - name: hosted_management_cluster
            type: string
        results:
          - name: env
            description: OpenShift CI workflow environment as JSON
        steps:
          - name: prepare-env
            image: quay.io/konflux-ci/konflux-test:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              image_content_sources=$(cat <<'EOF'
              - source: registry.redhat.io/rhosdt/tempo-rhel9-operator
                mirrors:
                  - quay.io/redhat-user-workloads/rhosdt-tenant/tempo/tempo-operator
              - source: registry.redhat.io/rhosdt/tempo-rhel9
                mirrors:
                  - quay.io/redhat-user-workloads/rhosdt-tenant/tempo/tempo
              - source: registry.redhat.io/rhosdt/tempo-query-rhel9
                mirrors:
                  - quay.io/redhat-user-workloads/rhosdt-tenant/tempo/tempo-query
              - source: registry.redhat.io/rhosdt/tempo-jaeger-query-rhel9
                mirrors:
                  - quay.io/redhat-user-workloads/rhosdt-tenant/tempo/tempo-jaeger-query
              - source: registry.redhat.io/rhosdt/tempo-gateway-rhel9
                mirrors:
                  - quay.io/redhat-user-workloads/rhosdt-tenant/tempo/tempo-gateway
              - source: registry.redhat.io/rhosdt/tempo-gateway-opa-rhel9
                mirrors:
                  - quay.io/redhat-user-workloads/rhosdt-tenant/tempo/tempo-opa
              - source: registry.redhat.io/rhosdt/tempo-operator-bundle
                mirrors:
                  - quay.io/redhat-user-workloads/rhosdt-tenant/tempo/tempo-bundle
              EOF
              )

              jq -cn \
                --arg computeNodeType "$(params.compute_node_type)" \
                --arg nodeCount "$(params.hypershift_node_count)" \
                --arg managementCluster "$(params.hosted_management_cluster)" \
                --arg imageContentSources "$image_content_sources" \
                '{
                  COMPUTE_NODE_TYPE: $computeNodeType,
                  HYPERSHIFT_NODE_COUNT: $nodeCount,
                  HOSTED_MANAGEMENT_CLUSTER: $managementCluster,
                  IMAGE_CONTENT_SOURCES: $imageContentSources
                }' | tee "$(results.env.path)"
    - name: provision-cluster
      runAfter:
        - prepare-cluster-env
      when:
        - input: $(tasks.parse-metadata.results.test-event-type)
          operator: in
          values: ["push", "Push", "PUSH", "incoming", "Incoming", "INCOMING"]
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: timeout
          value: 1h
        - name: releases
          value: >-
            {"latest":{"release":{"channel":"stable","version":"$(params.ocp_version)","architecture":"multi"}}}
        - name: env
          value: $(tasks.prepare-cluster-env.results.env)
    - name: tempo-install
      description: Task to install bundle onto ephemeral namespace
      runAfter:
        - provision-cluster
      when:
        - input: $(tasks.parse-metadata.results.test-event-type)
          operator: in
          values: ["push", "Push", "PUSH", "incoming", "Incoming", "INCOMING"]
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: namespace
          value: "$(params.namespace)"
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: SNAPSHOT
          - name: namespace
            type: string
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
        steps:
          - name: install-operator
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: KONFLUX_COMPONENT_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['appstudio.openshift.io/component']
              - name: KUBECONFIG
                value: /credentials/kubeconfig
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              echo "Kubeconfig file"
              cat $KUBECONFIG

              echo "Create namespace to install Tempo Operator"
              oc create namespace $(params.namespace)
              oc label namespaces $(params.namespace) openshift.io/cluster-monitoring=true --overwrite=true

              echo "Get the bundle image"
              echo ${KONFLUX_COMPONENT_NAME}
              export BUNDLE_IMAGE="$(jq -r --arg component_name "$KONFLUX_COMPONENT_NAME" '.components[] | select(.name == $component_name) | .containerImage' <<< "$SNAPSHOT")"
              echo "${BUNDLE_IMAGE}"

              echo "Install Tempo Operator"
              operator-sdk run bundle --timeout=5m --namespace "$(params.namespace)" "$BUNDLE_IMAGE" --verbose
              oc wait --for condition=Available -n "$(params.namespace)" deployment tempo-operator-controller
    - name: operators-install
      description: Task to install dependent operators onto ephemeral namespace
      runAfter:
        - tempo-install
      when:
        - input: $(tasks.parse-metadata.results.test-event-type)
          operator: in
          values: ["push", "Push", "PUSH", "incoming", "Incoming", "INCOMING"]
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: namespace
          value: "$(params.namespace)"
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: SNAPSHOT
          - name: namespace
            type: string
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
        steps:
          - name: install-operators
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: KONFLUX_TEMPO_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: konflux-tempo-access-token-read-only
                    key: token
              - name: KONFLUX_COMPONENT_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['appstudio.openshift.io/component']
              - name: KUBECONFIG
                value: /credentials/kubeconfig
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              echo "Kubeconfig file"
              cat $KUBECONFIG

              echo "Installing dependent operators"
              export OPERATORS_INSTALL=https://raw.githubusercontent.com/os-observability/konflux-tempo/refs/heads/main/.tekton/integration-tests/resources/install.yaml
              curl -H "Authorization: token $KONFLUX_TEMPO_TOKEN" -Lo /tmp/install.yaml "$OPERATORS_INSTALL"
              oc apply -f /tmp/install.yaml

              retry_count=30
              sleep_duration=30

              check_operator_installed() {
                local operator=$1
                local namespace=$2
                local csv=""
                local retries=0

                for i in $(seq $retry_count); do
                  if [[ -z "$csv" ]]; then
                    csv=$(oc get subscription -n $namespace $operator -o jsonpath='{.status.installedCSV}')
                  fi

                  if [[ -z "$csv" ]]; then
                    echo "Try ${i}/${retry_count}: can't get the $operator yet. Checking again in $sleep_duration seconds"
                    sleep $sleep_duration
                  else
                    if [[ $(oc get csv -n $namespace $csv -o jsonpath='{.status.phase}') == "Succeeded" ]]; then
                      echo "$operator is successfully installed in namespace $namespace"
                      return 0
                    else
                      echo "Try ${i}/${retry_count}: $operator is not deployed yet. Checking again in $sleep_duration seconds"
                      sleep $sleep_duration
                    fi
                  fi
                done

                echo "$operator installation failed after $retry_count retries in namespace $namespace."
                return 1
              }

              echo "Checking installation status of operators..."
              check_operator_installed "opentelemetry-product" openshift-opentelemetry-operator
              check_operator_installed "kiali-ossm" openshift-operators
              check_operator_installed "servicemeshoperator" openshift-operators
              check_operator_installed "serverless-operator" openshift-serverless
              echo "Operator installation check completed."
    - name: check-tempo-version
      description: The task checks Tempo operator and operand version details and image info
      runAfter:
        - tempo-install
      when:
        - input: $(tasks.parse-metadata.results.test-event-type)
          operator: in
          values: ["push", "Push", "PUSH", "incoming", "Incoming", "INCOMING"]
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: namespace
          value: "$(params.namespace)"
        - name: JAEGER_QUERY_VERSION
          value: "$(params.operand_jaeger_query_version)"
        - name: OPERATOR_VERSION
          value: "$(params.operator_version)"
        - name: OPERATOR_TEMPO_VERSION
          value: "$(params.operator_tempo_version)"
        - name: OPERATOR_TEMPO_QUERY_VERSION
          value: "$(params.operator_tempo_query_version)"
        - name: OPERAND_TEMPO_VERSION
          value: "$(params.operand_tempo_version)"
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: SNAPSHOT
          - name: namespace
            type: string
          - name: JAEGER_QUERY_VERSION
            type: string
          - name: OPERATOR_VERSION
            type: string
          - name: OPERATOR_TEMPO_VERSION
            type: string
          - name: OPERATOR_TEMPO_QUERY_VERSION
            type: string
          - name: OPERAND_TEMPO_VERSION
            type: string
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
        steps:
          - name: check-version
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: KONFLUX_TEMPO_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: konflux-tempo-access-token-read-only
                    key: token
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              #!/bin/bash
              set -eu

              # Variables for strings to check
              JAEGER_QUERY_VERSION="$(params.JAEGER_QUERY_VERSION)"
              OPERATOR_VERSION="$(params.OPERATOR_VERSION)"
              OPERATOR_TEMPO_VERSION="$(params.OPERATOR_TEMPO_VERSION)"
              OPERATOR_TEMPO_QUERY_VERSION="$(params.OPERATOR_TEMPO_QUERY_VERSION)"
              OPERAND_TEMPO_VERSION="$(params.OPERAND_TEMPO_VERSION)"

              function log_cmd() {
                  echo "\$ $*"
                  "$@"
              }
              function exit_error() {
                  >&2 echo -e "ERROR: $*"
                  exit 1
              }

              function generate_random_name() {
                  echo "random-name-$RANDOM"
              }

              function wait_for_pod_running() {
                  local pod_name=$1
                  local namespace=$2
                  while true; do
                      pod_status=$(oc get pod $pod_name -n $namespace -o jsonpath='{.status.phase}')
                      if [ "$pod_status" == "Running" ]; then
                          break
                      elif [ "$pod_status" == "Failed" ] || [ "$pod_status" == "Unknown" ]; then
                          exit_error "Pod $pod_name failed to start. Status: $pod_status"
                      fi
                      sleep 2
                  done
              }

              function check_strings_in_logs() {
                  local pod_name=$1
                  local namespace=$2
                  shift 2
                  local strings=("$@")

                  logs=$(oc logs pod/$pod_name -n $namespace)
                  for string in "${strings[@]}"; do
                      if ! echo "$logs" | grep -q "$string"; then
                          exit_error "String '$string' not found in logs of pod $pod_name"
                      fi
                  done
              }

              echo "Kubeconfig file"
              cat $KUBECONFIG

              echo
              echo
              echo "TEMPO IMAGE DETAILS AND VERSION INFO"
              echo

              export TEMPO_ICSP=https://raw.githubusercontent.com/os-observability/konflux-tempo/refs/heads/main/.tekton/integration-tests/resources/ImageContentSourcePolicy.yaml
              curl -H "Authorization: token $KONFLUX_TEMPO_TOKEN" -Lo /tmp/ImageContentSourcePolicy.yaml "$TEMPO_ICSP"

              tempo_images=$(oc get deployment tempo-operator-controller -n openshift-tempo-operator -o yaml | grep -o "registry.redhat.io/rhosdt/.*" | sort | uniq)
              [ $(echo "$tempo_images" | wc -l) -eq 6 ] || exit_error "Expected 6 images, found:\n$tempo_images"

              for image in $tempo_images; do
                  oc image info "$image" --icsp-file /tmp/ImageContentSourcePolicy.yaml --filter-by-os linux/amd64
                  echo

                  random_name=$(generate_random_name)

                  if [[ $image == *tempo-rhel9@* ]]; then
                      log_cmd oc run $random_name -n default --image=$image -- --version
                      wait_for_pod_running $random_name default
                      log_cmd oc logs pod/$random_name -n default
                      check_strings_in_logs $random_name default "tempo, version ${OPERAND_TEMPO_VERSION}"
                  elif [[ $image == *tempo-gateway-rhel9* || $image == *tempo-gateway-opa-rhel9* || $image == *tempo-query-rhel9* ]]; then
                      echo "SKIPPED: $image doesn't have a version command"
                  elif [[ $image == *tempo-rhel9-operator@* ]]; then
                      log_cmd oc run $random_name -n default --image=$image -- version
                      wait_for_pod_running $random_name default
                      log_cmd oc logs pod/$random_name -n default
                      check_strings_in_logs $random_name default "\"operator-version\":\"${OPERATOR_VERSION}\"" "\"tempo-version\":\"${OPERATOR_TEMPO_VERSION}\"" "\"tempo-query-version\":\"${OPERATOR_TEMPO_QUERY_VERSION}\""
                  elif [[ $image == *tempo-jaeger-query-rhel9@* ]]; then
                      log_cmd oc run $random_name -n default --image=$image -- version
                      wait_for_pod_running $random_name default
                      log_cmd oc logs pod/$random_name -n default
                      check_strings_in_logs $random_name default "\"gitVersion\":\"${JAEGER_QUERY_VERSION}\""
                  else
                      log_cmd oc run $random_name -n default --image=$image -- version
                      wait_for_pod_running $random_name default
                      log_cmd oc logs pod/$random_name -n default
                  fi

                  echo
                  echo
              done
    - name: dast-test
      description: Task to run Dynamic Application Security Testing (DAST) using RapiDAST
      runAfter:
        - operators-install
      when:
        - input: $(tasks.parse-metadata.results.test-event-type)
          operator: in
          values: ["push", "Push", "PUSH", "incoming", "Incoming", "INCOMING"]
      params:
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
          - name: gcs-key
            secret:
              secretName: rapidast-sa-rhosdt-key
        steps:
          - name: rapidast-scan
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: gcs-key
                mountPath: /etc/gcs
                readOnly: true
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
              - name: RHOSDT_VERSION
                value: $(params.rhosdt_version)
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              echo "Kubeconfig file"
              cat $KUBECONFIG

              echo "Clone distributed-tracing-qe repository"
              git clone https://github.com/openshift/distributed-tracing-qe.git /tmp/distributed-tracing-tests
              cd /tmp/distributed-tracing-tests

              # Generate GCS secret manifest for chainsaw to apply on the ephemeral cluster
              kubectl create secret generic rapidast-sa-rhosdt-key \
                --from-file=sa-key=/etc/gcs/sa-key \
                --namespace=rapidast-tempo \
                --dry-run=client -o yaml > tests/e2e-rh-sdl/rapidast-tempo/gcs-secret.yaml

              # Unset environment variable which conflicts with Chainsaw
              unset NAMESPACE

              # Execute DAST test using RapiDAST
              chainsaw test \
              --config .chainsaw-rh-sdl.yaml \
              --test-dir \
              tests/e2e-rh-sdl/rapidast-tempo
    - name: tempo-e2e-tests
      description: Task to run tests from service repository
      runAfter:
        - dast-test
      when:
        - input: $(tasks.parse-metadata.results.test-event-type)
          operator: in
          values: ["push", "Push", "PUSH", "incoming", "Incoming", "INCOMING"]
      params:
        - name: TEMPO_TESTS_BRANCH
          value: $(params.tempo_tests_branch)
        - name: SKIP_TESTS
          value: $(params.skip_tests)
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-cluster.results.secretRef)
      taskSpec:
        params:
          - name: TEMPO_TESTS_BRANCH
            type: string
          - name: SKIP_TESTS
            type: string
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
        steps:
          - name: run-e2e-tests
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: /credentials/kubeconfig
            image: quay.io/redhat-distributed-tracing-qe/konflux-e2e:latest
            script: |
              echo "Kubeconfig file"
              cat $KUBECONFIG
              TEMPO_TESTS_BRANCH="$(params.TEMPO_TESTS_BRANCH)"
              SKIP_TESTS="$(params.SKIP_TESTS)"

              echo "Run e2e tests"
              git clone https://github.com/os-observability/tempo-operator.git /tmp/tempo-tests
              cd /tmp/tempo-tests
              git checkout $TEMPO_TESTS_BRANCH

              #Enable user workload monitoring.
              oc apply -f tests/e2e-openshift/monitoring/01-workload-monitoring.yaml

              # Remove test cases to be skipped from the test run
              IFS=' ' read -ra SKIP_TEST_ARRAY <<< "$SKIP_TESTS"
              SKIP_TESTS_TO_REMOVE=""
              INVALID_TESTS=""
              for test in "${SKIP_TEST_ARRAY[@]}"; do
                if [[ "$test" == tests/* ]]; then
                  SKIP_TESTS_TO_REMOVE+=" $test"
                else
                  INVALID_TESTS+=" $test"
                fi
              done

              if [[ -n "$INVALID_TESTS" ]]; then
                echo "These test cases are not valid to be skipped: $INVALID_TESTS"
              fi

              if [[ -n "$SKIP_TESTS_TO_REMOVE" ]]; then
                rm -rf $SKIP_TESTS_TO_REMOVE
              fi

              # Unset environment variable which conflicts with Chainsaw
              unset NAMESPACE

              # Execute Tempo e2e tests
              chainsaw test \
              --quiet \
              --config .chainsaw-openshift.yaml \
              --test-dir \
              tests/e2e \
              tests/e2e-openshift \
              tests/e2e-openshift-serverless \
              tests/e2e-openshift-ossm \
              tests/e2e-openshift-object-stores \
              tests/e2e-long-running \
              tests/e2e-openshift-tshirt-sizes \
              tests/operator-metrics
